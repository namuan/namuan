<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image → 3D (Three.js)</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #14161c; font-family: ui-sans-serif, system-ui, sans-serif; }
  header {
    position: absolute; inset: 0 0 auto 0; z-index: 20;
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: linear-gradient(rgba(0,0,0,.55), transparent);
    color: #fff; font-size: 13px; pointer-events: none;
  }
  header .title { font-weight: 600; letter-spacing: .02em; }
  header .hint { opacity: .6; }
  header .buttons { margin-left: auto; display: flex; gap: 8px; pointer-events: auto; }
  header button {
    background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
    padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px;
  }
  header button:hover { background: rgba(255,255,255,.22); }
  #stage { position: fixed; inset: 0; }
  #reference { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #canvas-wrap { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--split, 50%)) 0 0); }
  #canvas-wrap canvas { display: block; width: 100%; height: 100%; }
  #divider {
    position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 2px; z-index: 15;
    background: rgba(255,255,255,.9); cursor: ew-resize; touch-action: none;
  }
  #divider::after {
    content: "◂ ▸"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #fff; color: #14161c; font-size: 11px; line-height: 1; padding: 6px 8px;
    border-radius: 999px; white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <span class="title">Image → 3D</span>
  <span class="hint">drag the divider to compare · drag to orbit · scroll to zoom</span>
  <span class="buttons">
    <button id="rotate-btn">Auto-rotate: on</button>
    <button id="reset-btn">Reset camera</button>
  </span>
</header>

<div id="stage">
  <img id="reference" src="reference.jpg" alt="reference image">
  <div id="canvas-wrap"></div>
  <div id="divider"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- optional: ?img=your-photo.jpg overrides the reference image -------------
const params = new URLSearchParams(location.search);
const imgSrc = params.get('img');
if (imgSrc) document.getElementById('reference').src = imgSrc;

// --- scene -------------------------------------------------------------------
const stage = document.getElementById('stage');
const canvasWrap = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
canvasWrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5, 4.5, 7);
camera.lookAt(0, 0.8, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.saveState();

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3d46, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb7ff, 0.8);
rim.position.set(-4, 2, -5);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// =============================================================================
// EDIT ME: build your model here. Replace the example mug with the object
// in the reference image. One named Group per part. Meters as units.
// =============================================================================
function createModel() {
  const root = new THREE.Group();
  root.name = 'model-root';

  // Example: a stylized coffee mug (delete and rebuild from your reference).
  const mug = new THREE.Group();
  mug.name = 'mug';

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd95f4f, roughness: 0.35, metalness: 0.05 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.85, 1.7, 48), bodyMat);
  body.name = 'body';
  body.position.y = 0.85;
  body.castShadow = true;
  mug.add(body);

  // Half torus as the handle: rotate -90° about Z so the arch becomes a "C"
  // whose open end faces the body.
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.12, 20, 48, Math.PI), bodyMat);
  handle.name = 'handle';
  handle.position.set(0.85, 0.9, 0);
  handle.rotation.z = -Math.PI / 2;
  handle.castShadow = true;
  mug.add(handle);

  const coffee = new THREE.Mesh(
    new THREE.CircleGeometry(0.82, 48),
    new THREE.MeshStandardMaterial({ color: 0x2b1a12, roughness: 0.9 })
  );
  coffee.name = 'coffee';
  coffee.position.y = 1.701;
  coffee.rotation.x = -Math.PI / 2;
  mug.add(coffee);

  root.add(mug);
  return root;
}
// =============================================================================

scene.add(createModel());

// --- resize -------------------------------------------------------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- wipe divider -------------------------------------------------------------
const divider = document.getElementById('divider');
divider.addEventListener('pointerdown', (e) => {
  divider.setPointerCapture(e.pointerId);
});
divider.addEventListener('pointermove', (e) => {
  if (!divider.hasPointerCapture(e.pointerId)) return;
  const pct = Math.min(95, Math.max(5, (e.clientX / innerWidth) * 100));
  stage.style.setProperty('--split', pct + '%');
});

// --- header buttons ------------------------------------------------------------
document.getElementById('rotate-btn').addEventListener('click', function () {
  controls.autoRotate = !controls.autoRotate;
  this.textContent = controls.autoRotate ? 'Auto-rotate: on' : 'Auto-rotate: off';
});
document.getElementById('reset-btn').addEventListener('click', () => controls.reset());

// --- render loop ---------------------------------------------------------------
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
